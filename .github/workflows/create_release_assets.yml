name: Create Release

# Erstellt ein Release bei einem Push mit Tag
# Prüft ob Tag, Version im Code und oberster Eintrag in der changelog.md übereinstimmen
# nutzt den obersten Abschnitt der changelog.md als Beschreibung für das Release
# baut die Firmware und lädt die aktuellen Release-Dateien als Assets hoch

on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  create_release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Extract version from header file
        id: extract_version
        run: |
          # Liest die Version aus der Header-Datei aus und entfernt Anführungszeichen
          VERSION=$(grep '#define VERSION' ./include/config.h | awk '{print $3}' | tr -d '"')
          echo "Extracted version: $VERSION"
          echo "VERSION=$VERSION" >> $GITHUB_ENV

      - name: Check if version matches tag
        id: check_version
        run: |
          echo "Current tag: ${{ github.ref_name }}"
          echo "Project version: $VERSION"
          if [ "$VERSION" != "${{ github.ref_name }}" ]; then
            echo "Version mismatch: $VERSION does not match tag ${{ github.ref_name }}"
            exit 1
          fi

      - name: Check changelog header and prepare release notes
        id: check_changelog
        run: |
          changelog_version=$(awk '/^#[[:space:]]+v?[0-9]+\.[0-9]+\.[0-9]+[[:space:]]*$/ { print $2; exit }' changelog.md)
          echo "Changelog version: $changelog_version"

          if [[ -z "$changelog_version" ]]; then
            echo "No release version header found in changelog.md"
            exit 1
          fi

          if [[ "$changelog_version" != "$VERSION" ]]; then
            echo "Changelog version $changelog_version does not match project version $VERSION"
            exit 1
          fi

          awk '
            /^#[[:space:]]+v?[0-9]+\.[0-9]+\.[0-9]+[[:space:]]*$/ {
              if (found) exit
              found = 1
            }
            found && /^---[[:space:]]*$/ { exit }
            found { print }
          ' changelog.md > release_notes.md

          if [[ ! -s release_notes.md ]]; then
            echo "No release notes could be extracted from changelog.md"
            exit 1
          fi
        shell: bash

      - name: Build release assets
        run: ./build/build.sh release

      - name: Check release assets
        run: |
          test -f "build/artifacts/esp32_jarolift_ota_${VERSION}.bin"
          test -f "build/artifacts/esp32_jarolift_flash_${VERSION}.bin"

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          tag: ${{ github.ref_name }}
        run: |
          # Erstelle das Release und lade die Assets hoch
          gh release create "$tag" \
              "build/artifacts/esp32_jarolift_ota_${VERSION}.bin" \
              "build/artifacts/esp32_jarolift_flash_${VERSION}.bin" \
              --repo="$GITHUB_REPOSITORY" \
              --title="${tag}" \
              -F release_notes.md

      - name: Clean up
        run: rm release_notes.md
