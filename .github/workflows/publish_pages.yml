name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. Check out the repository
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. Generate the WebUI from the checked-out sources
      - name: Generate WebUI
        run: ./build/build.sh release

      # 3. Verify the complete Pages output
      - name: Verify Pages output
        run: |
          test -s build/artifacts/web/index.html
          test -s build/artifacts/web/lib.css
          test -s build/artifacts/web/user.css
          test -s build/artifacts/web/lib.js
          test -s build/artifacts/web/user.js
          test -s build/artifacts/web/config.json
          test -s build/artifacts/web/sim.json

      # 4. Deploy to GitHub Pages
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: build/artifacts/web
